# NodeTool CI/CD for PI Server (Docker Swarm)
# Trigger: push to main → build → deploy → notify

stages:
  - build
  - deploy
  - notify

variables:
  DEPLOY_PATH: /opt/apps/nodetool
  STACK_NAME: nodetool
  IMAGE_NAME: nodetool:local

# ─────────────────────────────────────────────────────────────
# Build
# ─────────────────────────────────────────────────────────────
build:
  stage: build
  tags:
    - pi
  only:
    - main
  script:
    - cd $DEPLOY_PATH
    - git fetch gitlab main
    - git reset --hard gitlab/main
    - |
      echo "Building Docker image..."
      docker build \
        --build-arg GIT_COMMIT_HASH=${CI_COMMIT_SHORT_SHA} \
        --build-arg BUILD_NUMBER=${CI_PIPELINE_IID} \
        -t ${IMAGE_NAME} .
    - docker image prune -f
  timeout: 60 minutes

# ─────────────────────────────────────────────────────────────
# Deploy
# ─────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  tags:
    - pi
  only:
    - main
  needs:
    - build
  script:
    - cd $DEPLOY_PATH
    - |
      echo "Loading environment..."
      export $(grep -v '^#' .env | xargs)
    - |
      echo "Deploying stack..."
      docker stack deploy -c stack.yml ${STACK_NAME}
    - |
      echo "Checking service status..."
      sleep 5
      docker service ls | grep ${STACK_NAME}
      docker service ps ${STACK_NAME}_app --no-trunc | head -5
  environment:
    name: production
    url: https://nodetool.tarotgobot.online

# ─────────────────────────────────────────────────────────────
# Notifications
# ─────────────────────────────────────────────────────────────
notify_success:
  stage: notify
  tags:
    - pi
  only:
    - main
  when: on_success
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d text="✅ <b>nodetool deployed</b>%0A%0A📦 <code>${CI_COMMIT_SHORT_SHA}</code>%0A📝 ${CI_COMMIT_TITLE}%0A🔗 <a href=\"${CI_PIPELINE_URL}\">Pipeline</a>"

notify_failure:
  stage: notify
  tags:
    - pi
  only:
    - main
  when: on_failure
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
        -d chat_id="${TELEGRAM_CHAT_ID}" \
        -d parse_mode="HTML" \
        -d text="❌ <b>nodetool FAILED</b>%0A%0A📦 <code>${CI_COMMIT_SHORT_SHA}</code>%0A📝 ${CI_COMMIT_TITLE}%0A🔗 <a href=\"${CI_PIPELINE_URL}\">Pipeline</a>"
